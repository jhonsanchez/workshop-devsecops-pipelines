    - "Paso 1 — Gitleaks Local": lab03-secretos/step1.md
    - "Paso 2 — Añadir Stage al Pipeline": lab03-secretos/step2.md
    - "Paso 3 — Probar y Remediar": lab03-secretos/step3.md
