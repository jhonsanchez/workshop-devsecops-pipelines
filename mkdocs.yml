site_name: DevSecOps Pipelines Workshop
site_description: >
  A hands-on workshop by Entelgy covering Static Analysis, Dynamic Testing,
  Container Security, IaC Scanning, and Secrets Detection in modern CI/CD pipelines.
site_author: Entelgy
site_url: https://workshops.entelgy.com/devsecops/
copyright: Copyright &copy; 2026 Entelgy. All rights reserved.

repo_name: jhonsanchez/workshop-devsecops-pipelines
repo_url: https://github.com/jhonsanchez/workshop-devsecops-pipelines

# ─── Theme ────────────────────────────────────
theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  language: es

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

  font:
    text: Inter
    code: JetBrains Mono

  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - search.highlight
    - search.share
    - search.suggest
    - header.autohide
    - announce.dismiss

# ─── Extra CSS ────────────────────────────────
extra_css:
  - stylesheets/extra.css

# ─── Navigation ───────────────────────────────
nav:
  - Inicio: index.md
  - "Bienvenida":
    - modulo0/index.md
  - "Configuración":
    - setup/index.md
  - "Concepto 1 — CI/CD y Seguridad":
    - concepto01-cicd/index.md
  - "Concepto 2 — Anatomía del Pipeline":
    - concepto02-anatomia-pipeline/index.md
  - "Concepto 3 — Secretos en Código":
    - concepto03-secretos/index.md
  - "Concepto 4 — Análisis Estático":
    - concepto04-sast/index.md
  - "Concepto 5 — Cadena de Suministro":
    - concepto05-sca/index.md
  - "Concepto 6 — Artefactos e Inmutabilidad":
    - concepto06-artefactos/index.md
  - "Concepto 7 — Registros y Confianza":
    - concepto07-registros-confianza/index.md
  - "Concepto 8 — Pruebas Dinámicas":
    - concepto08-dast/index.md
  - "Concepto 9 — IaC y Seguridad":
    - concepto09-iac/index.md
  - "Concepto 10 — Despliegues Seguros":
    - concepto10-despliegues/index.md
  - "Concepto 11 — Monitorización":
    - concepto11-monitorizacion/index.md
  - "Resultados del Pipeline":
    - resultados/index.md
    - "1. Secretos": resultados/01-secretos.md
    - "2. SAST": resultados/02-sast.md
    - "3. SCA": resultados/03-sca.md
    - "4. Build": resultados/04-build.md
    - "5. Image Scan + Firma": resultados/05-image-scan.md
    - "6. IaC Scan": resultados/06-iac.md
    - "7. Staging": resultados/07-staging.md
    - "8. DAST": resultados/08-dast.md
    - "9. Producción": resultados/09-produccion.md
    - "10. Monitor": resultados/10-monitor.md
  - Cierre:
    - cierre/index.md
    - Limpieza: limpieza/index.md
  - Tags: tags.md

# ─── Plugins ──────────────────────────────────
plugins:
  - search:
      lang: es
  - tags:
      enabled: true

# ─── Markdown Extensions ──────────────────────
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.mark
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: En esta página

# ─── Extra ────────────────────────────────────
extra:
  generator: false
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/entelgy
      name: Entelgy en LinkedIn
    - icon: fontawesome/solid/globe
      link: https://www.entelgy.com
      name: entelgy.com
