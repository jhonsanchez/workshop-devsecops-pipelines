    - "Paso 2 — Stages de Deploy": lab10-deploy/step2.md
    - "Paso 3 — Pipeline Completo": lab10-deploy/step3.md
  - "Concepto 11 — Monitorización":
    - concepto11-monitorizacion/index.md
  - "Lab 11 — Monitorización Post-Despliegue":
    - lab11-monitorizacion/index.md
    - "Paso 1 — Health Checks y Alertas": lab11-monitorizacion/step1.md
    - "Paso 2 — Dashboard de Seguridad": lab11-monitorizacion/step2.md
  - Cierre:
    - cierre/index.md
  - Limpieza:
    - limpieza/index.md
  - Tags: tags.md

# ─── Plugins ──────────────────────────────────
plugins:
  - search:
      lang: es
  - tags:
      enabled: true

# ─── Markdown Extensions ──────────────────────
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.mark
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: En esta página

# ─── Extra ────────────────────────────────────
extra:
  generator: false
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/entelgy
      name: Entelgy en LinkedIn
    - icon: fontawesome/solid/globe
      link: https://www.entelgy.com
      name: entelgy.com
