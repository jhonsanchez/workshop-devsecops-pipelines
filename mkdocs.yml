site_name: DevSecOps Pipelines Workshop
site_description: >
  A hands-on workshop by Entelgy covering Static Analysis, Dynamic Testing,
  Container Security, IaC Scanning, and Secrets Detection in modern CI/CD pipelines.
site_author: Entelgy
site_url: https://workshops.entelgy.com/devsecops/
copyright: Copyright &copy; 2026 Entelgy. All rights reserved.

repo_name: jhonsanchez/workshop-devsecops-pipelines
repo_url: https://github.com/jhonsanchez/workshop-devsecops-pipelines

# ─── Theme ────────────────────────────────────
theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  language: es

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

  font:
    text: Inter
    code: JetBrains Mono

  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - search.highlight
    - search.share
    - search.suggest
    - header.autohide
    - announce.dismiss

# ─── Extra CSS ────────────────────────────────
extra_css:
  - stylesheets/extra.css

# ─── Navigation ───────────────────────────────
nav:
  - Inicio: index.md
  - "Módulo 0 — Bienvenida":
    - modulo0/index.md
    - Prerequisitos: modulo0/prerequisites.md
  - "Concepto 1 — CI/CD y Seguridad":
    - concepto01-cicd/index.md
  - "Lab 1 — Proyecto Azure DevOps":
    - lab01-setup/index.md
    - "Paso 1 — Crear Proyecto y Conectar Repo": lab01-setup/step1.md
    - "Paso 2 — Verificar el Pipeline": lab01-setup/step2.md
  - "Concepto 2 — Anatomía del Pipeline":
