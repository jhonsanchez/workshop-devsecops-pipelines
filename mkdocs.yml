    - "Paso 1 — Trivy FS y SBOM Local": lab05-sca/step1.md
    - "Paso 2 — Añadir Stage SCA": lab05-sca/step2.md
  - "Concepto 6 — Artefactos e Inmutabilidad":
    - concepto06-artefactos/index.md
  - "Lab 6 — Build e Imagen":
    - lab06-build/index.md
    - "Paso 1 — Hardening del Dockerfile": lab06-build/step1.md
    - "Paso 2 — Stage de Build + ACR": lab06-build/step2.md
    - "Paso 3 — Inmutabilidad en ACR": lab06-build/step3.md
  - "Concepto 7 — Registros y Confianza":
    - concepto07-registros-confianza/index.md
  - "Lab 7 — Escaneo y Firma de Imagen":
    - lab07-image-signing/index.md
    - "Paso 1 — Escaneo con Trivy Image": lab07-image-signing/step1.md
    - "Paso 2 — Firma con Cosign": lab07-image-signing/step2.md
    - "Paso 3 — Verificación de Firmas": lab07-image-signing/step3.md
  - "Concepto 8 — Pruebas Dinámicas":
    - concepto08-dast/index.md
  - "Lab 8 — DAST con OWASP ZAP":
    - lab08-dast/index.md
    - "Paso 1 — Desplegar Staging en Pipeline": lab08-dast/step1.md
    - "Paso 2 — Escaneo ZAP": lab08-dast/step2.md
    - "Paso 3 — Análisis y Ajuste": lab08-dast/step3.md
  - "Concepto 9 — IaC y Seguridad":
    - concepto09-iac/index.md
  - "Lab 9 — Escaneo de IaC":
