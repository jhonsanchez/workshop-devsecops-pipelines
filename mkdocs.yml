    - "Paso 1 — Semgrep Local": lab04-sast/step1.md
    - "Paso 2 — Añadir Stage SAST": lab04-sast/step2.md
    - "Paso 3 — Reglas Personalizadas": lab04-sast/step3.md
  - "Concepto 5 — Cadena de Suministro":
