# ═══════════════════════════════════════════════════════════════
# DevSecOps Pipeline — Azure DevOps
# Entelgy Workshop: Pipeline completo de seguridad
#
# Stages:
#   1. SecretsDetection  — Gitleaks
#   2. SAST              — Semgrep
#   3. SCA               — Trivy fs + SBOM
#   4. Build             — Docker build + push ACR
#   5. ImageScan         — Trivy image + Cosign sign
#   6. IaCScan           — Checkov + Conftest
#   7. DeployStaging     — Terraform apply (staging)
#   8. DAST              — OWASP ZAP
#   9. DeployProduction  — Terraform apply (production)
#  10. Monitor           — Health checks + alertas
# ═══════════════════════════════════════════════════════════════

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: devsecops-workshop-secrets
  - name: acrName
    value: 'entelgyworkshopacr'
  - name: acrLoginServer
    value: 'entelgyworkshopacr.azurecr.io'
  - name: imageName
    value: 'devsecops-vulnerable-app'
  - name: imageTag
    value: '$(Build.BuildId)'
  - name: imageRef
    value: '$(acrLoginServer)/$(imageName):$(imageTag)'
  - name: resourceGroup
    value: 'rg-workshop'

# ── Stage 1: Detección de Secretos ──────────────────────────────
stages:
  - stage: SecretsDetection
    displayName: '1. Detección de Secretos'
    jobs:
      - job: Gitleaks
        displayName: 'Gitleaks Scan'
        steps:
          - checkout: self
            fetchDepth: 0

          - script: |
              docker run --rm \
                -v $(Build.SourcesDirectory):/repo \
                zricethezav/gitleaks:latest detect \
                --source=/repo \
                --report-format=sarif \
                --report-path=/repo/gitleaks-report.sarif \
                --exit-code=1
            displayName: 'Gitleaks — Escaneo de Secretos'
            continueOnError: false

          - task: PublishBuildArtifacts@1
            condition: always()
            inputs:
              pathToPublish: '$(Build.SourcesDirectory)/gitleaks-report.sarif'
              artifactName: 'gitleaks-report'
            displayName: 'Publicar reporte Gitleaks'

  # ── Stage 2: SAST ──────────────────────────────────────────────
  - stage: SAST
    displayName: '2. Análisis Estático (SAST)'
    dependsOn: SecretsDetection
    jobs:
      - job: Semgrep
        displayName: 'Semgrep Scan'
        steps:
          - checkout: self

          - script: |
              docker run --rm \
                -v $(Build.SourcesDirectory):/src \
                semgrep/semgrep:latest semgrep scan \
                --config=auto \
                --config=p/owasp-top-ten \
                --config=p/secrets \
                --config=/src/.semgrep/rules/ \
                --sarif --output=/src/semgrep-report.sarif \
                --severity=ERROR \
                --error \
                /src
            displayName: 'Semgrep — SAST Scan'
            continueOnError: false

          - task: PublishBuildArtifacts@1
            condition: always()
            inputs:
              pathToPublish: '$(Build.SourcesDirectory)/semgrep-report.sarif'
              artifactName: 'semgrep-report'
            displayName: 'Publicar reporte Semgrep'

  # ── Stage 3: SCA ───────────────────────────────────────────────
  - stage: SCA
    displayName: '3. Análisis de Composición (SCA)'
    dependsOn: SAST
    jobs:
      - job: TrivyFS
        displayName: 'Trivy Filesystem Scan'
        steps:
          - checkout: self

          - script: |
              docker run --rm \
                -v $(Build.SourcesDirectory):/repo \
                aquasec/trivy:latest fs /repo \
                --severity CRITICAL,HIGH \
                --exit-code 1 \
                --format sarif \
                --output /repo/trivy-sca.sarif
            displayName: 'Trivy FS — Dependency Scan'
            continueOnError: false

          - script: |
              docker run --rm \
                -v $(Build.SourcesDirectory):/repo \
                aquasec/trivy:latest fs /repo \
                --format cyclonedx \
                --output /repo/sbom.json
            displayName: 'Generar SBOM (CycloneDX)'

          - task: PublishBuildArtifacts@1
            condition: always()
            inputs:
              pathToPublish: '$(Build.SourcesDirectory)/trivy-sca.sarif'
              artifactName: 'trivy-sca-report'
            displayName: 'Publicar reporte SCA'

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: '$(Build.SourcesDirectory)/sbom.json'
              artifactName: 'sbom'
            displayName: 'Publicar SBOM'

  # ── Stage 4: Build + Container Image ───────────────────────────
  - stage: Build
    displayName: '4. Build + Imagen de Contenedor'
    dependsOn: SCA
    jobs:
      - job: DockerBuild
        displayName: 'Docker Build & Push'
        steps:
          - checkout: self

          - task: Docker@2
            displayName: 'Login a ACR'
            inputs:
              containerRegistry: 'acr-service-connection'
              command: login

          - task: Docker@2
            displayName: 'Build & Push imagen'
            inputs:
              containerRegistry: 'acr-service-connection'
              repository: '$(imageName)'
              command: buildAndPush
              Dockerfile: '**/Dockerfile.secure'
              tags: |
                $(imageTag)
                $(Build.SourceVersion)

          - script: |
              echo "Imagen publicada: $(imageRef)"
              echo "SHA: $(Build.SourceVersion)"
              echo "##vso[task.setvariable variable=imageDigest;isOutput=true]$(docker inspect --format='{{index .RepoDigests 0}}' $(imageRef) 2>/dev/null || echo $(imageRef))"
            displayName: 'Registrar metadata de imagen'
            name: imageInfo

  # ── Stage 5: Image Scan + Firma ────────────────────────────────
  - stage: ImageScan
    displayName: '5. Escaneo de Imagen + Firma'
    dependsOn: Build
    jobs:
      - job: TrivyImageAndSign
        displayName: 'Trivy Image Scan + Cosign'
        steps:
          - script: |
              docker run --rm \
                -v /var/run/docker.sock:/var/run/docker.sock \
                aquasec/trivy:latest image \
                --severity CRITICAL,HIGH \
                --exit-code 1 \
                --format sarif \
                --output /tmp/trivy-image.sarif \
                $(imageRef)
            displayName: 'Trivy — Image Scan'
            continueOnError: false

          - task: PublishBuildArtifacts@1
            condition: always()
            inputs:
              pathToPublish: '/tmp/trivy-image.sarif'
              artifactName: 'trivy-image-report'
            displayName: 'Publicar reporte Trivy Image'

          - script: |
              # Instalar Cosign
              curl -sSLo cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
              chmod +x cosign

              # Firmar la imagen con clave del Key Vault
              ./cosign sign --key $(COSIGN_PRIVATE_KEY) \
                --yes \
                $(imageRef)

              echo "Imagen firmada: $(imageRef)"
            displayName: 'Cosign — Firma de Imagen'
            env:
              COSIGN_PRIVATE_KEY: $(cosignPrivateKey)

  # ── Stage 6: IaC Scan ─────────────────────────────────────────
  - stage: IaCScan
    displayName: '6. Escaneo de IaC'
    dependsOn: ImageScan
    jobs:
      - job: Checkov
        displayName: 'Checkov + Conftest'
        steps:
          - checkout: self

          - script: |
              docker run --rm \
                -v $(Build.SourcesDirectory)/infrastructure:/tf \
                bridgecrew/checkov:latest \
                -d /tf \
                --framework terraform \
                --output sarif \
                --output-file-path /tf/ \
                --soft-fail-on LOW,MEDIUM
            displayName: 'Checkov — IaC Scan'
            continueOnError: false

          - task: PublishBuildArtifacts@1
            condition: always()
            inputs:
              pathToPublish: '$(Build.SourcesDirectory)/infrastructure/results_sarif.sarif'
              artifactName: 'checkov-report'
            displayName: 'Publicar reporte Checkov'

          - script: |
              docker run --rm \
                -v $(Build.SourcesDirectory):/repo \
                openpolicyagent/conftest:latest test \
                /repo/infrastructure/ \
                --policy /repo/policy/ \
                --output json
            displayName: 'Conftest — Policy Check'
            continueOnError: false

  # ── Stage 7: Deploy a Staging ──────────────────────────────────
  - stage: DeployStaging
    displayName: '7. Deploy a Staging'
    dependsOn:
      - ImageScan
      - IaCScan
    jobs:
      - deployment: DeployToStaging
        displayName: 'Deploy Staging'
        environment: 'staging'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: 'Terraform Init & Apply — Staging'
                  inputs:
                    azureSubscription: 'azure-service-connection'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      cd $(Build.SourcesDirectory)/infrastructure
                      terraform init \
                        -backend-config="resource_group_name=$(resourceGroup)" \
                        -backend-config="storage_account_name=entelgytfstate" \
                        -backend-config="container_name=tfstate" \
                        -backend-config="key=staging.tfstate"
                      terraform apply -auto-approve \
                        -var="environment=staging" \
                        -var="image_tag=$(imageTag)"

                - script: |
                    echo "Staging desplegado. Esperando que la app esté lista..."
                    for i in $(seq 1 10); do
                      STATUS=$(curl -s -o /dev/null -w "%{http_code}" $(STAGING_URL)/health 2>/dev/null || echo "000")
                      if [ "$STATUS" = "200" ]; then
                        echo "App lista en staging"
                        exit 0
                      fi
                      echo "Intento $i/10 — status: $STATUS"
                      sleep 15
                    done
                    echo "ERROR: App no respondió en staging"
                    exit 1
                  displayName: 'Verificar deploy staging'

  # ── Stage 8: DAST ──────────────────────────────────────────────
  - stage: DAST
    displayName: '8. Análisis Dinámico (DAST)'
    dependsOn: DeployStaging
    jobs:
      - job: OWASPZAP
        displayName: 'OWASP ZAP Full Scan'
        steps:
          - checkout: self

          - script: |
              mkdir -p $(Build.SourcesDirectory)/zap-reports
              docker run --rm \
                -v $(Build.SourcesDirectory)/zap-reports:/zap/wrk \
                -v $(Build.SourcesDirectory)/.zap:/zap/policy \
                ghcr.io/zaproxy/zaproxy:stable \
                zap-full-scan.py \
                -t $(STAGING_URL) \
                -r zap-report.html \
                -J zap-report.json \
                -c /zap/policy/rules.tsv \
                -z "-config scanner.attackStrength=MEDIUM"
            displayName: 'OWASP ZAP — Full Scan'
            continueOnError: true

          - task: PublishBuildArtifacts@1
            condition: always()
            inputs:
              pathToPublish: '$(Build.SourcesDirectory)/zap-reports'
              artifactName: 'zap-report'
            displayName: 'Publicar reporte ZAP'

          - script: |
              # Verificar si hay alertas High o Critical
              HIGH_COUNT=$(cat $(Build.SourcesDirectory)/zap-reports/zap-report.json | python3 -c "
              import sys, json
              data = json.load(sys.stdin)
              alerts = data.get('site', [{}])[0].get('alerts', []) if data.get('site') else []
              high = sum(1 for a in alerts if int(a.get('riskcode', 0)) >= 3)
              print(high)
              " 2>/dev/null || echo "0")
              echo "Alertas High/Critical: $HIGH_COUNT"
              if [ "$HIGH_COUNT" -gt "0" ]; then
                echo "##vso[task.logissue type=error]DAST encontró $HIGH_COUNT alertas de riesgo Alto/Crítico"
                exit 1
              fi
            displayName: 'Evaluar resultados DAST'

  # ── Stage 9: Deploy a Producción ───────────────────────────────
  - stage: DeployProduction
    displayName: '9. Deploy a Producción'
    dependsOn: DAST
    condition: succeeded()
    jobs:
      - deployment: DeployToProd
        displayName: 'Deploy Producción'
        environment: 'production'   # Requiere aprobación manual
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - script: |
                    # Verificar firma de imagen antes de desplegar
                    curl -sSLo cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
                    chmod +x cosign
                    ./cosign verify --key $(COSIGN_PUBLIC_KEY) $(imageRef)
                    echo "Firma de imagen verificada correctamente"
                  displayName: 'Verificar firma de imagen'
                  env:
                    COSIGN_PUBLIC_KEY: $(cosignPublicKey)

                - task: AzureCLI@2
                  displayName: 'Terraform Init & Apply — Producción'
                  inputs:
                    azureSubscription: 'azure-service-connection'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      cd $(Build.SourcesDirectory)/infrastructure
                      terraform init \
                        -backend-config="resource_group_name=$(resourceGroup)" \
                        -backend-config="storage_account_name=entelgytfstate" \
                        -backend-config="container_name=tfstate" \
                        -backend-config="key=production.tfstate"
                      terraform apply -auto-approve \
                        -var="environment=production" \
                        -var="image_tag=$(imageTag)"

                - script: |
                    echo "Producción desplegado. Verificando..."
                    for i in $(seq 1 10); do
                      STATUS=$(curl -s -o /dev/null -w "%{http_code}" $(PRODUCTION_URL)/health 2>/dev/null || echo "000")
                      if [ "$STATUS" = "200" ]; then
                        echo "App lista en producción"
                        exit 0
                      fi
                      echo "Intento $i/10 — status: $STATUS"
                      sleep 15
                    done
                    echo "ERROR: App no respondió en producción"
                    exit 1
                  displayName: 'Verificar deploy producción'

  # ── Stage 10: Monitorización Post-Despliegue ───────────────────
  - stage: Monitor
    displayName: '10. Verificación Post-Despliegue'
    dependsOn: DeployProduction
    condition: succeeded()
    jobs:
      - job: HealthChecks
        displayName: 'Health Checks + Smoke Tests'
        steps:
          - script: |
              echo "=== Health Check ==="
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" $(PRODUCTION_URL)/health)
              echo "Health endpoint: $STATUS"
              [ "$STATUS" != "200" ] && echo "##vso[task.logissue type=error]Health check falló" && exit 1

              echo "=== Smoke Tests ==="
              # Verificar que los endpoints principales responden
              for endpoint in / /health /search?q=test; do
                CODE=$(curl -s -o /dev/null -w "%{http_code}" "$(PRODUCTION_URL)$endpoint")
                echo "  $endpoint → $CODE"
                [ "$CODE" -ge "500" ] && echo "##vso[task.logissue type=error]Endpoint $endpoint devolvió $CODE" && exit 1
              done

              echo "=== Verificar cabeceras de seguridad ==="
              HEADERS=$(curl -sI $(PRODUCTION_URL)/)
              echo "$HEADERS" | grep -qi "x-content-type-options" && echo "  X-Content-Type-Options: OK" || echo "  ##vso[task.logissue type=warning]Falta X-Content-Type-Options"
              echo "$HEADERS" | grep -qi "x-frame-options" && echo "  X-Frame-Options: OK" || echo "  ##vso[task.logissue type=warning]Falta X-Frame-Options"
              echo "$HEADERS" | grep -qi "strict-transport-security" && echo "  HSTS: OK" || echo "  ##vso[task.logissue type=warning]Falta HSTS"

              echo "=== Despliegue verificado ==="
            displayName: 'Health Checks y Smoke Tests'

      - job: SecurityAlerts
        displayName: 'Verificar Alertas de Seguridad'
        dependsOn: HealthChecks
        steps:
          - task: AzureCLI@2
            displayName: 'Comprobar alertas Azure Monitor'
            inputs:
              azureSubscription: 'azure-service-connection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "=== Alertas activas en los últimos 30 minutos ==="
                ALERTS=$(az monitor alert list \
                  --resource-group $(resourceGroup)-production \
                  --query "[?properties.essentials.startDateTime > '$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)']" \
                  --output json 2>/dev/null || echo "[]")

                CRITICAL=$(echo "$ALERTS" | python3 -c "
                import sys, json
                alerts = json.load(sys.stdin)
                critical = [a for a in alerts if a.get('properties', {}).get('essentials', {}).get('severity') in ('Sev0', 'Sev1')]
                print(len(critical))
                " 2>/dev/null || echo "0")

                echo "Alertas críticas: $CRITICAL"
                if [ "$CRITICAL" -gt "0" ]; then
                  echo "##vso[task.logissue type=error]Se detectaron $CRITICAL alertas críticas post-despliegue"
                  exit 1
                fi

                echo "=== Pipeline DevSecOps completado exitosamente ==="
                echo "Build: $(Build.BuildId)"
                echo "Imagen: $(imageRef)"
                echo "Entorno: Producción"
